<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101018"><title>Playlist — NoiseGround</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="top"><a class="brand" href="/">NOISE<span>GROUND</span></a><nav><a href="/">Browse audio</a></nav></header><main><section class="hero playlist-hero"><div class="eyebrow">NOISEGROUND PLAYLIST</div><h1 id="title">Loading playlist…</h1><p id="description"></p><div class="muted" id="meta"></div></section><section class="section"><div id="tracks" class="catalogue"><div class="empty">Loading recordings…</div></div></section></main><footer><a class="brand" href="/">NOISE<span>GROUND</span></a><span>Free public audio sharing.</span></footer><audio id="player" controls preload="none"></audio>
<script>
const API="https://mtxbpf8g3l.execute-api.us-east-1.amazonaws.com";
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function play(id){try{const r=await fetch(API+"/tracks/"+encodeURIComponent(id)+"/playback");const d=await r.json();if(!r.ok)throw new Error();const a=document.getElementById("player");a.src=d.url;a.classList.add("active");await a.play()}catch{alert("Playback is unavailable.")}}
async function load(){const id=new URLSearchParams(location.search).get("id");if(!id){document.getElementById("title").textContent="Playlist not found";return}try{const r=await fetch(API+"/playlists/"+encodeURIComponent(id)),p=await r.json();if(!r.ok)throw new Error();document.title=p.title+" — NoiseGround";document.getElementById("title").textContent=p.title;document.getElementById("description").textContent=p.description||"";document.getElementById("meta").textContent=(p.tracks||[]).length+" recordings";const box=document.getElementById("tracks");if(!p.tracks?.length){box.innerHTML='<div class="empty">This playlist has no public recordings yet.</div>';return}box.innerHTML=p.tracks.map(t=>'<article class="track"><span class="tag">'+esc(t.category||"Audio")+'</span><h3>'+esc(t.title)+'</h3><p>'+esc(t.artistName||"Independent creator")+'</p><button class="primary" data-play="'+esc(t.trackId)+'">Play recording</button></article>').join("");box.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>play(b.dataset.play))}catch{document.getElementById("title").textContent="Playlist unavailable";document.getElementById("tracks").innerHTML='<div class="empty">This playlist may be private or no longer available.</div>'}}
load();
</script></body></html>
